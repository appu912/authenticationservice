plugins {
    id 'war'
}

repositories {
    mavenCentral()
}

dependencies {
    providedCompile("jakarta.servlet:jakarta.servlet-api:6.0.0")
}

war {
    webAppDirectory = file("src/main/webapp") // Copies the contents of web content folder to root folder of WAR file in build/libs.
    from "WebContent"
}

// Creates a task called copyWar.
tasks.register("copyWar", Copy) {
    description = "Copies generated WAR file to jetty base webapps folder."
}

// Configures the task copyWar.
tasks.named("copyWar") {
    from "build/libs"
    into "${System.getenv('JETTY_BASE')}/webapps"
    include "*.war"
}